services:
  - type: web
    name: predikly-sales-helper
    runtime: docker
    plan: free
    repo: https://github.com/Bodke-blip/sales_helper_agent-.git
    branch: create-agent-gemini-tools
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_CLOUD_MANAGEMENT_KEY
        sync: false
      - key: QDRANT_CLOUD_ACCOUNT_ID
        sync: false
      - key: QDRANT_CLOUD_CLUSTER_ID
        sync: false
      - key: QDRANT_RECOVERY_RETRIES
        value: "8"
      - key: QDRANT_RECOVERY_RETRY_DELAY_SECONDS
        value: "4"
      - key: HYBRID_QDRANT_COLLECTION_NAME
        value: predikly_hybrid_search_data_v2
      - key: HYBRID_QDRANT_FALLBACK_COLLECTION_NAME
        value: predikly_hybrid_serch_data
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash-lite
      - key: PRIMARY_LLM_TIMEOUT_SECONDS
        value: "45"
      - key: HF_HUB_TOKEN
        sync: false
      - key: HF_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_TIMEOUT_SECONDS
        value: "20"
      - key: LIST_INTERNAL_KNOWLEDGE_DEFAULT_TOP_K
        value: "6"
      - key: LIST_INTERNAL_KNOWLEDGE_MAX_TOP_K
        value: "20"
      - key: BM25_STATE_PATH
        value: data/bm25_sparse_encoder.json
      - key: ENABLE_LANGFUSE_TRACING
        value: "true"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
